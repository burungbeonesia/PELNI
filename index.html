<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="description" content="Akses aplikasi web CV. BURUNG BEO melalui halaman resmi.">
  <title>CV. BURUNG BEO | Aplikasi</title>
  <style>
    :root {
      --navy: #0b1f3a;
      --blue: #145da0;
      --light: #f3f6fb;
      --text: #17243a;
      --muted: #68758a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; color: var(--text); }
    body { background: var(--light); display: flex; flex-direction: column; min-height: 100vh; }
    header {
      min-height: 64px; padding: 12px clamp(16px, 4vw, 40px);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      color: #fff; background: var(--navy); box-shadow: 0 2px 12px #07172b30;
    }
    .brand { font-weight: 800; letter-spacing: .5px; font-size: 17px; }
    .subbrand { font-size: 12px; color: #c8d8ec; margin-top: 3px; }
    .actions { display: flex; gap: 9px; flex-wrap: wrap; }
    a.button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 38px; padding: 9px 14px; border-radius: 8px;
      text-decoration: none; font-weight: 700; font-size: 13px;
      color: var(--navy); background: #fff;
    }
    a.button.primary { color: #fff; background: var(--blue); border: 1px solid #ffffff50; }
    main { flex: 1; display: flex; flex-direction: column; padding: 14px; }
    .app-frame {
      flex: 1; min-height: 70vh; width: 100%; overflow: hidden;
      background: #fff; border: 1px solid #dce4ef; border-radius: 12px;
      box-shadow: 0 6px 24px #0b1f3a12;
    }
    iframe { display: block; width: 100%; height: 100%; min-height: 70vh; border: 0; background: #fff; }
    .notice { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 8px 2px; line-height: 1.5; }
    footer { padding: 10px 16px 14px; text-align: center; color: var(--muted); font-size: 11px; }
    @media (max-width: 600px) {
      header { align-items: flex-start; flex-direction: column; }
      .actions { width: 100%; }
      a.button { flex: 1; }
      main { padding: 8px; }
      .app-frame, iframe { min-height: 76vh; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">CV. BURUNG BEO</div>
      <div class="subbrand">Halaman akses aplikasi</div>
    </div>
    <nav class="actions" aria-label="Navigasi aplikasi">
      <a class="button" href="https://script.google.com/macros/s/AKfycbx3Gjl0JDWDoFGcJABqnUVvjl_q6DTVT6_7MIYejN66nfSVLkHhlb09vSbL8FC_o0ZQ/exec" target="_blank" rel="noopener noreferrer">
        Buka di Tab Baru
      </a>
      <a class="button primary" href="https://script.google.com/macros/s/AKfycbx3Gjl0JDWDoFGcJABqnUVvjl_q6DTVT6_7MIYejN66nfSVLkHhlb09vSbL8FC_o0ZQ/exec" target="_blank" rel="noopener noreferrer">
        Buka Aplikasi
      </a>
    </nav>
  </header>

  <main>
    <section class="app-frame" aria-label="Aplikasi Google Apps Script">
      <iframe
        src="https://script.google.com/macros/s/AKfycbx3Gjl0JDWDoFGcJABqnUVvjl_q6DTVT6_7MIYejN66nfSVLkHhlb09vSbL8FC_o0ZQ/exec"
        title="Aplikasi CV. BURUNG BEO"
        loading="eager"
        allow="clipboard-read; clipboard-write; fullscreen"
        allowfullscreen>
      </iframe>
    </section>
    <div class="notice">
      Jika aplikasi tidak tampil di halaman ini, gunakan tombol <strong>Buka Aplikasi</strong>.
    </div>
  </main>

  <footer>© <span id="year"></span> CV. BURUNG BEO</footer>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
